<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Operation Puzzled Energy — TI4 Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b16;
      --panel: #12182b;
      --ink: #f4efe4;
      --muted: #b7b1a4;
      --gold: #e4c37a;
      --line: rgba(228, 195, 122, 0.28);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Source Sans 3", sans-serif; }
    body { min-height: 100vh; }
    a { color: var(--gold); }
    header {
      padding: 1.25rem 1.5rem 0.5rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: end;
    }
    h1, h2, h3 { font-family: Cinzel, serif; margin: 0; }
    h1 { font-size: clamp(1.4rem, 3vw, 2.1rem); letter-spacing: 0.04em; }
    .sub { color: var(--muted); margin-top: 0.35rem; }
    .toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    button, .btn {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.4rem 0.85rem;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
    }
    button.skip { border-color: var(--skip, var(--line)); }
    button.skip.active { background: color-mix(in srgb, var(--skip) 28%, transparent); color: var(--ink); border-color: var(--skip); }
    .skip-label { font-size: 11px; font-weight: 700; fill: #f6f1e3; paint-order: stroke; stroke: #140c08; stroke-width: 3px; }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(300px, 0.8fr);
      gap: 1rem;
      padding: 0.75rem 1.5rem 2rem;
    }
    .map-wrap {
      background: radial-gradient(circle at center, #15203a 0%, #070b16 72%);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      min-height: calc(100vh - 7.5rem);
    }
    .sidebar { display: grid; gap: 0.85rem; align-content: start; max-height: calc(100vh - 7.5rem); overflow: auto; }
    svg { width: 100%; height: auto; display: block; }
    .hex { cursor: pointer; }
    .hex.dim { opacity: 0.28; }
    .overlay-label { font-size: 11px; fill: #f6f1e3; paint-order: stroke; stroke: #140c08; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
    .tile-id { font-size: 10px; font-weight: 700; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 0.9rem;
    }
    .position {
      display: block;
      padding: 0.55rem 0.75rem 0.6rem 0.8rem;
      border-radius: 12px;
      cursor: pointer;
      border-left: 4px solid var(--gold);
      background: #0d1322;
    }
    .position + .position { margin-top: 0.45rem; }
    .position h3 { font-size: 1.02rem; line-height: 1.25; }
    .position .where { color: var(--muted); font-size: 0.82rem; margin-top: 0.1rem; }
    .position .adj { margin: 0.35rem 0 0; color: var(--ink); font-size: 0.88rem; line-height: 1.35; }
    .position.selected { outline: 2px solid var(--gold); }
    .meta { color: var(--muted); font-size: 0.92rem; }
    .links { display: flex; gap: 0.7rem; flex-wrap: wrap; margin-top: 0.3rem; font-size: 0.92rem; }
    .detail dt { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .detail dd { margin: 0 0 0.45rem; }
    .tts { font-family: ui-monospace, monospace; font-size: 0.78rem; word-break: break-word; color: var(--muted); }
    .unused { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 0.15rem 0.55rem; font-size: 0.85rem; }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      .map-wrap { min-height: 60vh; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Operation Puzzled Energy</h1>
      <p class="sub">7-player Magi's Madness · flat-top Milty tiles</p>
    </div>
    <div class="toolbar">
      <button id="view-art" class="active" type="button">Tile art</button>
      <button id="view-schema" type="button">Schematic</button>

      <button class="skip" id="skip-biotic" type="button" style="--skip:#2ecc71">Green</button>
      <button class="skip" id="skip-cybernetic" type="button" style="--skip:#f1c40f">Yellow</button>
      <button class="skip" id="skip-warfare" type="button" style="--skip:#e74c3c">Red</button>
      <button class="skip" id="skip-all" type="button" style="--skip:#e4c37a">All</button>
      <a class="btn" href="data/map.csv" download>Download CSV</a>
      <a class="btn" href="https://milty.shenanigans.be/d/20261027_84b2c85b5936a1ae?fresh=1#draft" target="_blank" rel="noreferrer">Milty draft</a>
    </div>
  </header>
  <main>
    <section class="map-wrap">
      <svg id="galaxy" viewBox="-360 -410 720 820" role="img" aria-label="Twilight Imperium galaxy map"></svg>

    <aside class="sidebar">
      <section class="card" id="picks"></section>
      <section class="card detail" id="detail">
        <h2>Tile</h2>
        <p class="meta">Click a hex or a player to inspect it.</p>

      <section class="card">
        <h2>TTS map string</h2>
        <p class="tts" id="tts"></p>
        <button type="button" id="copy-tts">Copy</button>
      </section>
      <section class="card">
        <h2>Draft</h2>
        <div id="unused"></div>
      </section>
    </aside>
  </main>

    function neighborOf(a, b) {
      return [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]]
        .some(([dq, dr]) => a.q + dq === b.q && a.r + dr === b.r);
    }
    function hexAt(q, r) {
      return data.hexes.find(h => h.q === q && h.r === r);
    }
    // Milty edge 0 is the top flat edge; indexes increase clockwise.
    const LANE_EDGE = [[0, -1], [1, -1], [1, 0], [0, 1], [-1, 1], [-1, 0]];
    function laneTargets(hex) {
      const turn = Math.round((hex.image_rotation || 0) / 60);
      const seen = [];
      for (const link of hex.hyperlanes || []) {
        for (const edge of link) {
          const [dq, dr] = LANE_EDGE[(edge + turn) % 6];
          const next = hexAt(hex.q + dq, hex.r + dr);
          if (next && !seen.includes(next)) seen.push(next);
        }
      }
      return seen;
    }
    function laneNetwork(start) {
      const lanes = [];
      const systems = [];
      const queue = [start];
      const seen = new Set([`${start.q},${start.r}`]);
      while (queue.length) {
        const lane = queue.shift();
        lanes.push(lane);
        for (const next of laneTargets(lane)) {
          const id = `${next.q},${next.r}`;
          if (seen.has(id)) continue;
          seen.add(id);
          if (next.is_hyperlane) queue.push(next);
          else systems.push(next);
        }
      }
      return { lanes, systems };
    }
    function sameFocus(a, b) {
      return a && b && a.kind === b.kind && a.key === b.key;
    }
    function focusFor(hex) {
      if (hex.position) return { kind: "position", key: hex.position };
      if (hex.is_hyperlane) return { kind: "hyperlane", key: `${hex.q},${hex.r}` };
      if (hex.wormhole) return { kind: "wormhole", key: hex.wormhole };
      return null;
    }
    function isLit(hex) {
      if (!focus) return true;
      if (focus.kind === "position") {
        const home = data.hexes.find(h => h.position === focus.key);
        return !!(home && (hex === home || neighborOf(home, hex)));
      }
      if (focus.kind === "wormhole") return hex.wormhole === focus.key;
      if (focus.kind === "hyperlane") {
        const lane = data.hexes.find(h => `${h.q},${h.r}` === focus.key);
        if (!lane) return false;
        const net = laneNetwork(lane);
        return net.lanes.includes(hex) || net.systems.includes(hex);
      }
      return true;
    }

    function renderPicks() {
      const root = document.getElementById("picks");
      root.innerHTML = "<h2>Positions</h2>";
      const homes = data.positions.slice().sort((a, b) => a.r - b.r || a.q - b.q);
      homes.forEach((p) => {
        const home = data.hexes.find(h => h.position === p.name);
        const adjacent = data.hexes
          .filter(h => neighborOf(home, h))
          .map(h => `${h.is_hyperlane ? "lane" : h.tile_id} ${h.system_label}`);
        const el = document.createElement("article");
        el.className = "position" + (focus && focus.kind === "position" && focus.key === p.name ? " selected" : "");
        el.style.borderLeftColor = p.color;
        const skips = neighborSkips(home);
        const skipText = skips.length ? `${skips.map(key => SKIP[key].name).join(", ")} tech skip` : "no tech skip";
        el.innerHTML = `
          <h3>${p.name}</h3>
          <div class="where">${p.resources} resources / ${p.influence} influence next door / ${skipText}</div>
          <p class="adj">${adjacent.join(" · ")}</p>`;
        el.addEventListener("click", () => {
          const next = { kind: "position", key: p.name };
          focus = sameFocus(focus, next) ? null : next;
          selected = home;
          renderAll();
        });
        root.appendChild(el);
      });
    }

    function renderDetail() {
      const root = document.getElementById("detail");
      const hex = selected || data.hexes.find(h => h.is_mecatol);
      const planets = (hex.planets || []).map(p =>
        `${p.name} ${p.resources}/${p.influence}${p.trait ? " · " + p.trait : ""}${p.legendary ? " · legendary" : ""}${p.specialties.length ? " · " + p.specialties.join(", ") : ""}`
      ).join("<br>");
      const stations = (hex.stations || []).map(s => `${s.name} ${s.resources}/${s.influence}`).join("<br>");
      root.innerHTML = `
        <h2>${hex.system_label}</h2>
        <dl>
          <dt>Tile</dt><dd>${hex.tile_id}${hex.is_home ? " · home" : ""}${hex.is_mecatol ? " · Mecatol" : ""}</dd>
          ${hex.position ? `<dt>Position</dt><dd>${hex.position}</dd>` : ""}
          <dt>Coordinate</dt><dd>${hex.q},${hex.r}</dd>
          <dt>Value</dt><dd>${hex.resources}/${hex.influence} (optimal ${hex.optimal_resources}/${hex.optimal_influence})</dd>
          ${hexSkips(hex).length ? `<dt>Tech skip</dt><dd>${hexSkips(hex).map(key => SKIP[key].name).join(", ")}</dd>` : ""}
          ${hex.wormhole ? `<dt>Wormhole</dt><dd>${hex.wormhole}</dd>` : ""}
          ${hex.is_hyperlane ? `<dt>Connects</dt><dd>${(() => { const net = laneNetwork(hex); return [...net.lanes.map(h => `${h.tile_id} hyperlane`), ...net.systems.map(h => `${h.tile_id} ${h.system_label}`)].join("<br>"); })()}</dd>` : ""}
          ${hex.wormhole ? `<dt>Linked by ${hex.wormhole}</dt><dd>${data.hexes.filter(h => h !== hex && h.wormhole === hex.wormhole).map(h => `${h.tile_id} ${h.system_label}`).join("<br>") || "none"}</dd>` : ""}
          ${hex.anomaly ? `<dt>Anomaly</dt><dd>${hex.anomaly}</dd>` : ""}
          ${planets ? `<dt>Planets</dt><dd>${planets}</dd>` : ""}
          ${stations ? `<dt>Stations</dt><dd>${stations}</dd>` : ""}
        </dl>`;
    }

    function renderUnused() {
      const root = document.getElementById("unused");

      const open = (data.factions || []).filter(f => !f.picked);

    }
